  <body>
    <form class="quiz-container">
      <h1>HTML QUIZ!</h1>
      <h3>Question 7 of 20:</h3>
      <p>Choose the correct HTML elements to define emphasized text</p>

      <div class="radio-group">
        <label class="option">
          <input type="radio" name="html" checked />
          <span class="custom-radio"></span>
          &lt;i&gt;
        </label>

        <label class="option">
          <input type="radio" name="html" />
          <span class="custom-radio"></span>
          &lt;italic&gt;
        </label>

        <label class="option">
          <input type="radio" name="html" />
          <span class="custom-radio"></span>
          &lt;em&gt;
        </label>
      </div>
