<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />
    <title>Document</title>
  </head>
  <body>
    <form class="quiz-container">
      <h1>HTML QUIZ!</h1>
      <h3>Question 8 of 20:</h3>
      <p>What is the correct HTML for creating a hyperlink?</p>

      <div class="radio-group">
        <label class="option">
          <input type="radio" name="html" checked />
          <span class="custom-radio"></span>
          &lt;a&gt;http://www.w3schools.com&lt;/a&gt;
        </label>

        <label class="option">
          <input type="radio" name="html" />
          <span class="custom-radio"></span>
          &lt;a href="http://www.w3schools.com">W3Schools /a&gt;
        </label>

        <label class="option">
          <input type="radio" name="html" />
          <span class="custom-radio"></span>
          &lt;a name="http://www.w3schools.com">W3Schools.com /a&gt;
        </label>

        <label class="option">
          <input type="radio" name="html" />
          <span class="custom-radio"></span>
          &lt;a url="http://www.w3schools.com">W3Schools.com /a&gt;
        </label>
      </div>
      <button type="button" onclick="window.location.href='question9.html'">
        Next➡️
      </button>
    </form>
  </body>
</html>
