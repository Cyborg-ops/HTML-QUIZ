<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <form class="quiz-container">
      <h1>HTML QUIZ!</h1>
      <h3>Question 11 of 20:</h3>
      <p>Which of these elements are all &lt;table&gt; elements?</p>

      <div class="radio-group">
        <label class="option">
          <input type="radio" name="html" checked />
          <span class="custom-radio"></span>
          &lt;table&gt;&lt;tr&gt;&lt;td&gt;
        </label>

        <label class="option">
          <input type="radio" name="html" />
          <span class="custom-radio"></span>
          &lt;table&gt;&lt;head&gt;&lt;tfoot&gt;
        </label>

        <label class="option">
          <input type="radio" name="html" />
          <span class="custom-radio"></span>
          &lt;table&gt;&lt;tr&gt;&lt;tt&gt;
        </label>

        <label class="option">
          <input type="radio" name="html" />
          <span class="custom-radio"></span>
          &lt;thead&gt;&lt;body&gt;&lt;tr&gt;
        </label>
      </div>
      <button type="button" onclick="window.location.href='question12.html'">
        ➡️
      </button>
    </form>
  </body>
</html>
