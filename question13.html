<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <form class="quiz-container">
      <h1>HTML QUIZ!</h1>
      <h3>Question 13 of 20:</h3>
      <p>How can you make a numbered list?</p>

      <div class="radio-group">
        <label class="option">
          <input type="radio" name="html" checked />
          <span class="custom-radio"></span>
          &lt;ul&gt;
        </label>

        <label class="option">
          <input type="radio" name="html" />
          <span class="custom-radio"></span>
          &lt;ol&gt;
        </label>

        <label class="option">
          <input type="radio" name="html" />
          <span class="custom-radio"></span>
          &lt;list&gt;
        </label>

        <label class="option">
          <input type="radio" name="html" />
          <span class="custom-radio"></span>
          &lt;dl&gt;
        </label>
      </div>
      <button type="button" onclick="window.location.href='question14.html'">
        ➡️
      </button>
    </form>
  </body>
</html>
