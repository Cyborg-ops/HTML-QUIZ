          <input type="radio" name="html" checked />

          &lt;input type="dropdown"&gt;

        <label class="option">
          <input type="radio" name="html" />
          <span class="custom-radio"></span>
          &lt;input type="list"&gt;
        </label>

        <label class="option">
          <input type="radio" name="html" />
          <span class="custom-radio"></span>
          &lt;select&gt;
        </label>

          <input type="radio" name="html" />
