<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <form class="quiz-container">
      <h1>HTML QUIZ!</h1>
      <h3>Question 19 of 20:</h3>
      <p>What is the correct HTML for inserting an image?</p>

      <div class="radio-group">
        <label class="option">
          <input type="radio" name="html" />
          <span class="custom-radio"></span>
          &lt;img alt="MyImage">image.gif&lt;/img&gt;
        </label>

        <label class="option">
          <input type="radio" name="html" />
          <span class="custom-radio"></span>
          &lt;img href="image" alt="MyImage"&gt;
        </label>

        <label class="option">
          <input type="radio" name="html" />
          <span class="custom-radio"></span>
          &lt;img src="image.gif" alt="MyImage"&gt;
        </label>

        <label class="option">
          <input type="radio" name="html" />
          <span class="custom-radio"></span>
          &lt;image src="image.gif" alt="MyImage"&gt;
        </label>
      </div>
      <button type="button" onclick="window.location.href='question20.html'">
        ➡️
      </button>
    </form>
  </body>
</html>
