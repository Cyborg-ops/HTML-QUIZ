<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <form class="quiz-container">
      <h1>HTML QUIZ!</h1>
      <h3>Question 20 of 20:</h3>
      <p>What is the correct HTML for inserting a background image?</p>

      <div class="radio-group">
        <label class="option">
          <input type="radio" name="html" />
          <span class="custom-radio"></span>
          &lt;background img="background.gif"&gt;
        </label>

        <label class="option">
          <input type="radio" name="html" />
          <span class="custom-radio"></span>
          &lt;body bg="background.gif"&gt;
        </label>

        <label class="option">
          <input type="radio" name="html" />
          <span class="custom-radio"></span>
          &lt;body style="background-image:url(background.gif)"&gt;
        </label>
      </div>
      <button type="button" onclick="window.location.href='result.html'">
        ➡️
      </button>
    </form>
  </body>
</html>
