<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <form class="quiz-container">
      <h1>HTML QUIZ!</h1>
      <h3>Question 5 of 20:</h3>
      <p>What is the correct HTML for adding a background color?</p>

      <div class="radio-group">
        <label class="option">
          <input type="radio" name="html" checked />
          <span class="custom-radio"></span>
          &lt;body style="background-color:yellow;"&gt;
        </label>

        <label class="option">
          <input type="radio" name="html" />
          <span class="custom-radio"></span>
          &lt;body bg="yellow"&gt;
        </label>

        <label class="option">
          <input type="radio" name="html" />
          <span class="custom-radio"></span>
          &lt;background&gt;yellow&lt;/background&gt;
        </label>
      </div>
      <button type="button" onclick="window.location.href='question6.html'">
        ➡️
      </button>
    </form>
  </body>
</html>
