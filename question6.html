<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

  <body>
    <form class="quiz-container">
      <h1>HTML QUIZ!</h1>
      <h3>Question 6 of 20:</h3>
      <p>Choose the correct HTML elements to define important text</p>

      <div class="radio-group">
        <label class="option">
          <input type="radio" name="html" checked />
          <span class="custom-radio"></span>
          &lt;important&gt;
        </label>

        <label class="option">
          <input type="radio" name="html" />
          <span class="custom-radio"></span>
          &lt;i&gt;
        </label>

        <label class="option">
          <input type="radio" name="html" />
          <span class="custom-radio"></span>
          &lt;strong&gt;
        </label>

        <label class="option">
          <input type="radio" name="html" />
          <span class="custom-radio"></span>
          &lt;b&gt;
        </label>
      </div>
      <button type="button" onclick="window.location.href='question7.html'">
        Next➡️
      </button>
    </form>
  </body>
